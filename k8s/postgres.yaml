# NEW CODE - PostgreSQL StatefulSet with Headless Service and PVC
# =============================================================================
# Headless Service for PostgreSQL StatefulSet
# Provides stable network identities for each pod (postgres-0, postgres-1, etc.)
apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
  namespace: default
  labels:
    app: postgres
spec:
  clusterIP: None  # Headless service - no cluster IP assigned
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: postgres
---
# PostgreSQL StatefulSet with Persistent Volume Claims
# Ensures stable pod identities, ordered deployment/scaling, and persistent storage
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: default
  labels:
    app: postgres
spec:
  serviceName: postgres-svc  # Must match the headless service name
  replicas: 2
  selector:
    matchLabels:
      app: postgres-pod
  template:
    metadata:
      labels:
        app: postgres-pod
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - configMapRef:
                name: url-shortener-config
            - secretRef:
                name: url-shortener-secrets
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Liveness probe to detect unhealthy containers
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - urlshortener
            initialDelaySeconds: 30
            periodSeconds: 10
          # Readiness probe to detect when pod is ready to serve traffic
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - urlshortener
            initialDelaySeconds: 5
            periodSeconds: 5
  # VolumeClaimTemplate creates a PVC for each pod automatically
  # This ensures each pod gets its own persistent storage
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app: postgres-pod
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ""  # Use default storage class
        resources:
          requests:
            storage: 1Gi