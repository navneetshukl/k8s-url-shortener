apiVersion: v1
kind: ConfigMap
metadata:
  name: url-shortener-config
  namespace: default
  labels:
    app: url-shortener
data:
  # App config
  POSTGRES_HOST: "postgres-svc"
  REDIS_HOST: "redis-svc"
  BASE_URL: "http://url-shortener"
  # Postgres config
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "urlshortener"
  POSTGRES_PORT: "5432"
  # Redis config
  REDIS_PORT: "6379"
  REDIS_DB: "0"